<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS pays
         it back with env(safe-area-inset-*). user-scalable=no keeps a
         double-tap from zooming the camera view. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <!-- PWA. iOS ignores the manifest's icons entirely and uses
         apple-touch-icon, which must be a PNG — an SVG here silently produces a
         blank home-screen tile. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meera" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The reference sets its display type in a geometric grotesque at light
         weight; Inter is the closest widely-available match. 300 carries the
         oversized titles, 400/500 the UI text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Meera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
